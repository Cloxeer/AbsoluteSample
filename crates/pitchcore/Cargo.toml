[package]
name = "pitchcore"
version = "0.1.0"
edition = "2021"
description = "Monophonic vocal pitch analysis, note model and TD-PSOLA retuning. Runs natively and as WebAssembly."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
hound = "3"

